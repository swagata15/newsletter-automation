name: AI newsletter

on:
  schedule:
    # Times are UTC. The issue type for each day comes from `schedule:` in config.yaml.
    - cron: "17 11 * * 2"   # Tuesday: psychology deep dive
    - cron: "17 11 * * 4"   # Thursday: weekend build tutorial
    - cron: "17 11 * * 5"   # Friday: this week in AI
  workflow_dispatch:
    inputs:
      type:
        description: "Which category (all = one batch per category)"
        type: choice
        options: [auto, all, weekly, psychology, tutorial]
        default: auto
      count:
        description: "How many issues per category (bulk). Topics come from config.yaml backlogs."
        default: "1"
      topic:
        description: "Optional topic override (psychology / tutorial)"
        required: false
      upload_drafts:
        description: "Upload all pre-written issues to Substack as drafts (ignores the options above)"
        type: boolean
        default: false
      upload_limit:
        description: "With upload: how many (0 = all). Try 1 first."
        default: "1"
      mode:
        description: "draft = review in Substack first, publish = send to subscribers"
        type: choice
        options: [draft, publish]
        default: draft

permissions:
  contents: write   # to commit history.json so topics are not repeated

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Research, write and post to Substack
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL || 'https://swagataashwani.substack.com' }}
          SUBSTACK_COOKIES: ${{ secrets.SUBSTACK_COOKIES }}
          SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
          SUBSTACK_PASSWORD: ${{ secrets.SUBSTACK_PASSWORD }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TYPE: ${{ inputs.type || 'auto' }}
          ISSUE_TOPIC: ${{ inputs.topic }}
          ISSUE_COUNT: ${{ inputs.count || '1' }}
          UPLOAD_DRAFTS: ${{ inputs.upload_drafts && 'true' || 'false' }}
          UPLOAD_LIMIT: ${{ inputs.upload_limit || '0' }}
          PUBLISH_MODE: ${{ inputs.mode || vars.PUBLISH_MODE || 'draft' }}
        run: python -m newsletter
      - name: Save issues to the repo (issues/<category>/...) and record topics
        if: always()
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add history.json issues/
          git diff --cached --quiet || (git commit -m "Add newsletter issue(s)" && git push)
