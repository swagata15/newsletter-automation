name: Weekly AI newsletter

on:
  schedule:
    # Every Monday at 13:17 UTC. Change to taste: https://crontab.guru
    - cron: "17 13 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "draft = review in Substack first, publish = send to subscribers"
        type: choice
        options: [draft, publish]
        default: draft

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate issue and post to Substack
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
          SUBSTACK_COOKIES: ${{ secrets.SUBSTACK_COOKIES }}
          SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
          SUBSTACK_PASSWORD: ${{ secrets.SUBSTACK_PASSWORD }}
          PUBLISH_MODE: ${{ inputs.mode || vars.PUBLISH_MODE || 'draft' }}
        run: python -m newsletter
      - name: Keep a copy of the issue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-issue
          path: output/
          if-no-files-found: ignore
