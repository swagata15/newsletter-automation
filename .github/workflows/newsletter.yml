name: AI newsletter

on:
  schedule:
    # Times are UTC. The issue type for each day comes from `schedule:` in config.yaml.
    - cron: "17 11 * * 2"   # Tuesday: psychology deep dive
    - cron: "17 11 * * 4"   # Thursday: weekend build tutorial
    - cron: "17 11 * * 5"   # Friday: this week in AI
  workflow_dispatch:
    inputs:
      type:
        description: "Which issue to generate"
        type: choice
        options: [auto, weekly, psychology, tutorial]
        default: auto
      topic:
        description: "Optional topic override (psychology / tutorial)"
        required: false
      mode:
        description: "draft = review in Substack first, publish = send to subscribers"
        type: choice
        options: [draft, publish]
        default: draft

permissions:
  contents: write   # to commit history.json so topics are not repeated

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Research, write and post to Substack
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
          SUBSTACK_COOKIES: ${{ secrets.SUBSTACK_COOKIES }}
          SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
          SUBSTACK_PASSWORD: ${{ secrets.SUBSTACK_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TYPE: ${{ inputs.type || 'auto' }}
          ISSUE_TOPIC: ${{ inputs.topic }}
          PUBLISH_MODE: ${{ inputs.mode || vars.PUBLISH_MODE || 'draft' }}
        run: python -m newsletter
      - name: Save the issue, charts and research notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
      - name: Record topic in history.json
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "Record newsletter topic" && git push)
